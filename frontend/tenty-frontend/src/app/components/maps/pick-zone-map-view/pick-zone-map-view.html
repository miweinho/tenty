<!-- pick-location-map-view.html -->
<div class="pick-zone-container">
  <div class="map-wrapper">
    <app-map (mapReady)="onMapReady($event)"></app-map>
  </div>

  <mat-toolbar color="primary" class="pick-zone-toolbar">
    <button
      mat-raised-button
      color="accent"
      type="button"
      (click)="startPickingZone()"
      [disabled]="pickingActive">
      <mat-icon>gesture</mat-icon>
      @if (!pickingActive) {
        <span>Draw zone</span>
      } @else {
        <span>Draw polygon…</span>
      }
    </button>

    <button
      mat-button
      type="button"
      (click)="clearZone()"
      [disabled]="!hasSelection">
      <mat-icon>delete</mat-icon>
      Delete Zone
    </button>

    <span class="spacer"></span>

    <button
      mat-stroked-button
      color="primary"
      type="button"
      (click)="confirmZone()"
      [disabled]="!hasSelection">
      <mat-icon>check</mat-icon>
      Choose zone
    </button>

    <button
      mat-button
      type="button"
      (click)="onCancel()">
      <mat-icon>close</mat-icon>
      Abort
    </button>
  </mat-toolbar>
</div>
