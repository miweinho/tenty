<!-- pick-location-map-view.html -->
<div class="pick-location-container">
  <div class="map-wrapper">
    <app-map (mapReady)="onMapReady($event)"></app-map>
    <div class="overlay-controls">
      <mat-toolbar color="primary" class="pick-location-toolbar">
        <button
          mat-raised-button
          color="accent"
          type="button"
          (click)="startPickingLocation()"
          [disabled]="pickingActive"
        >
          <mat-icon>place</mat-icon>
          @if (!pickingActive) {
          <span>Pick Location</span>
          } @else {
          <span>Click on the map…</span>
          }
        </button>

        <span class="spacer"></span>

        <button
          mat-stroked-button
          color="primary"
          type="button"
          (click)="confirmSelection()"
          [disabled]="!hasSelection"
        >
          <mat-icon>check</mat-icon>
          Take location
        </button>

        <button mat-button type="button" (click)="onCancel()">
          <mat-icon>close</mat-icon>
          Abort
        </button>
      </mat-toolbar>
    </div>
  </div>
</div>
