<div class="main-camp-view">
  @if (loading) {
  <mat-spinner class="loading-spinner" diameter="50"></mat-spinner>
  } @else {
    <mat-chip disabled>{{ camp?.name ?? 'Camp' }}</mat-chip>
      <div class="map-container">
        <app-camp-main-map-view [camp]="camp" [features]="features"> </app-camp-main-map-view>
      </div>
      <div class="floating-toolbar">
        <app-map-toolbar
        (refresh)="onRefresh()"
        (drawTent)="onDrawTent()"
        (save)="onSave()">
      </app-map-toolbar>
      </div>

  

  } @if(error) {
  <div class="error-message">{{ error }}</div>
  }
</div>
