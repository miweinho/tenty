<div class="main-camp-view">
  
@if (loading) {
  <mat-spinner class="loading-spinner" diameter="50"></mat-spinner>
} @else {
  <mat-toolbar color="primary">
    <span>{{ camp?.name ?? 'Camp' }}</span>
    <span class="spacer"></span>
    <app-map-toolbar
      (drawTent)="onDrawTent()"
      (refresh)="onRefresh()"
      (save)="onSave()">
    </app-map-toolbar>
  </mat-toolbar>

  <div class="map-container">
    <app-camp-main-map-view
      [camp]="camp"
      [features]="features">
    </app-camp-main-map-view>
  </div>

}
  @if(error) {
      <div class="error-message">{{ error }}</div>

  }
</div>
