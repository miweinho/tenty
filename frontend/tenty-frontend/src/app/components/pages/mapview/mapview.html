<div class="map-container">
  <app-map (mapReady)="onMapReady($event)"></app-map>
  
  <div class="drawing-controls">
    <button (click)="startDrawing('Point')">Point</button>
    <button (click)="startDrawing('LineString')">Line</button>
    <button (click)="startDrawing('Polygon')">Polygon</button>
    <button (click)="stopDrawing()">Stop</button>
    <button (click)="clearAll()">Clear All</button>
  </div>
  <div class="map-controls">
  <button (click)="addCamp()">Add camp</button>
</div>
</div>
